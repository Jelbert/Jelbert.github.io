<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jelbert Games</title>
<meta name="description" content="Games by Jelbert.">
<style>
  :root { --bg: #ffffff; --text: #1d2330; --muted: #5a6475; --accent: #1f6fd1; --line: #dde2ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1220; --text: #e4e8f0; --muted: #9aa4b6; --accent: #6cb4ff; --line: #2a3346; }
  }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 40px 16px; }
  h1 { font-size: 1.8rem; margin: 0 0 1.5em; }
  .game { border: 1px solid var(--line); border-radius: 8px; padding: 16px 20px; }
  .game h2 { margin: 0 0 4px; font-size: 1.2rem; }
  .game p { margin: 0 0 12px; color: var(--muted); }
  a { color: var(--accent); }
  .links a { margin-right: 16px; }
</style>
</head>
<body>
<main>
  <h1>Jelbert Games</h1>
  <div class="game">
    <h2>Simple Sky Shooter</h2>
    <p>One-finger arcade shoot-'em-up for Android: drag to fly, hold to fire, and beat a new boss every stage.</p>
    <div class="links">
      <a href="https://play.google.com/store/apps/details?id=com.jelbert.sky_shooter">Google Play</a>
      <a href="https://jelbert.github.io/sky-shooter-privacy/">Privacy policy</a>
    </div>
  </div>
</main>
</body>
</html>
